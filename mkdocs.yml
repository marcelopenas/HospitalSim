site_name: HospitalSim
site_description: Hospital operations simulation and relational CRUD API
site_author: marcelopenas
site_url: https://marcelopenas.github.io/HospitalSim/
repo_url: https://github.com/marcelopenas/HospitalSim/
repo_name: marcelopenas/HospitalSim

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Dashboard guide: dashboard.md
  - Dashboard walkthrough: vid/index.md
  - Architecture: architecture.md
  - API usage: api/index.md
  - Data model:
      - Overview: models/index.md
      - Hospital: models/hospital.md
      - Patient: models/patient.md
      - Staff: models/staff.md
      - Role: models/roles.md
  - Development: development.md
  - Troubleshooting: troubleshooting.md

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.instant
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - footnotes
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
