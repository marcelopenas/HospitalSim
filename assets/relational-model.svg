<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060" role="img" aria-labelledby="title description">
<title id="title">HospitalSim relational model — MySQL Workbench style</title>
<desc id="description">Six tables with columns, native MySQL types, primary keys, foreign keys, nullability, and crow's-foot relationships. Staff roles has a composite identifying primary key. App state is separate application metadata.</desc>

