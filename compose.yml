services:
  web:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENV=production
      - DATABASE_URL=mysql://root:password@db/hospitalsim
    depends_on:
      - db

  db:
    image: mysql:latest
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DB: hospitalsim
    volumes:
      - db-data:/var/lib/mysql

volumes:
  db-data: